[tool.poetry]
name = "flip-radar"
version = "0.1.0"
description = "Telegram-бот для флиппинга NFT-подарков с 3 режимами анализа"
authors = ["Flip Radar Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.15.0"
pyrogram = "^2.0.106"
tgcrypto = "^1.2.5"
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
alembic = "^1.14.0"
redis = "^5.2.0"
httpx = "^0.28.0"
pydantic-settings = "^2.6.1"
structlog = "^24.4.0"
pyyaml = "^6.0.2"
pillow = "^11.0.0"
scikit-learn = "^1.5.2"
numpy = "^2.1.3"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.2"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
